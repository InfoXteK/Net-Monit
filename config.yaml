smtp:
  enabled: false
  host: smtp-mail.outlook.com
  port: 587
  use_tls: true
  username: ''
  password: ''
  from_address: ''
  admin_emails: []
  support_emails: []
  manager_emails: []
  to_addresses: []
  resend_interval_minutes: 30
defaults:
  poll_interval_seconds: 30
  ping_timeout_ms: 1000
  thresholds:
    latency_ms:
      warning: 100
      critical: 300
    packet_loss_pct:
      warning: 5
      critical: 20
    cpu_pct:
      warning: 75
      critical: 90
    memory_pct:
      warning: 80
      critical: 95
    disk_pct:
      warning: 80
      critical: 95
    bandwidth_pct:
      warning: 70
      critical: 90
devices: []
